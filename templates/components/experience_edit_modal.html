<div id="edit-experience-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-experience-modal-title">

    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup form edit pengalaman"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup form edit pengalaman">×</button>

        <h2 id="edit-experience-modal-title">Edit Pengalaman</h2>
        <form id="experience-edit-form" class="project-form">
            <input type="hidden" id="edit-exp-id" name="id">

            <div class="form-group">
                <label for="edit-exp-title">Nama Posisi/Peran</label>
                <input type="text" id="edit-exp-title" name="title" required maxlength="255" placeholder="e.g. Staff of Documentation">
            </div>

            <div class="form-group">
                <label for="edit-exp-organisation">Nama Organisasi</label>
                <input type="text" id="edit-exp-organisation" name="organisation" required maxlength="255" placeholder="e.g. BEM Fasilkom UI">
            </div>

            <div class="form-group">
                <label for="edit-exp-category">Kategori Pengalaman</label>
                <select id="edit-exp-category" name="category" class="form-select">
                    <option value="full-time">Full-Time</option>
                    <option value="part-time">Part-Time</option>
                    <option value="internship">Internship</option>
                    <option value="research">Research</option>
                    <option value="volunteer">Volunteer</option>
                    <option value="freelance">Freelance</option>
                </select>
            </div>

            <div class="form-group">
                <label for="edit-exp-thumbnail">URL Thumbnail (opsional)</label>
                <input type="url" id="edit-exp-thumbnail" name="thumbnail" placeholder="https://...">
            </div>

            <div class="form-group">
                <label for="edit-exp-description">Deskripsi Pengalaman</label>
                <textarea id="edit-exp-description" name="description" rows="4" placeholder="Jelaskan peran dan kontribusi..."></textarea>
            </div>

            <div class="form-group">
                <label for="edit-exp-started_at">Waktu Mulai</label>
                <input type="date" id="edit-exp-started_at" name="started_at" required>
            </div>

            <div class="form-group">
                <label for="edit-exp-ended_at">Waktu Selesai (opsional, kosongkan jika sedang berlangsung)</label>
                <input type="date" id="edit-exp-ended_at" name="ended_at">
            </div>

            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-experience-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
