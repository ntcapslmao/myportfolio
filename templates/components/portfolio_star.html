<form method="post" action="{% url 'main:toggle_star_portfolio' creative_project.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in creative_project.starred_by.all %} is-starred{% endif %}"
            title="{% if creative_project.starred_by.all %}Dibintangi oleh {{ creative_project.starred_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in creative_project.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ creative_project.starred_by.count }}</span>
    </button>
</form>
