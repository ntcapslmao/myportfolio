{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ name }} - Portfolio{% endblock title %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block meta %} {% endblock meta %}
</head>

<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">Ghazi Alfisyahri</a>

            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="nav-toggle-label"><span></span></label>

            <nav>
                <a href="{% url 'main:show_main' %}" class="{% if request.resolver_match.url_name == 'show_main' %} active {% endif %}">
                    Profile
                </a>
                <a href="{% url 'main:show_experience' %}" class="{% if request.resolver_match.url_name == 'show_experience' %} active {% endif %}">
                    Experience
                </a>
                <a href="{% url 'main:show_education' %}" class="{% if request.resolver_match.url_name == 'show_education' %} active {% endif %}">
                    Education
                </a>
                <a href="{% url 'main:show_portfolio' %}" class="{% if request.resolver_match.url_name == 'show_portfolio' %} active {% endif %}">
                    Creative
                </a>
                <a href="{% url 'main:show_projects' %}" class="{% if request.resolver_match.url_name == 'show_projects' %} active {% endif %}">
                    Projects
                </a>
            </nav>
        </div>
    </header>
    {% block content %} {% endblock content %}
    
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
