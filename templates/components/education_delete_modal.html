<p class="education-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-education-{{ education.id }}"
            aria-label="Hapus {{ education.title }}"
            title="Hapus riwayat pendidikan">
        Hapus Riwayat Pendidikan
    </button>
</p>
<div id="delete-education-{{ education.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-education-title-{{ education.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-education-{{ education.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-education-{{ education.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-education-title-{{ education.id }}">Hapus Riwayat Pendidikan?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ education.degree }} di {{ education.institution }}</strong>?
        </p>
        <form method="post" action="{% url 'main:delete_education' education.id %}" style="margin-top: 1.5rem;">
            {% csrf_token %}
            <div class="form-group" style="text-align: left;">
                <label for="passcode-{{ education.id }}">Kata Sandi:</label>
                <input type="password" name="passcode" id="passcode-{{ education.id }}" placeholder="Masukkan kode rahasia" required>
            </div>
            
            <div class="project-delete-modal__actions" style="margin-top: 1.5rem;">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="delete-education-{{ education.id }}"
                        popovertargetaction="hide">Batal</button>
                        
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </div>
        </form>
    </div>
</div>
